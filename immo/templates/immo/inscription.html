{% extends 'immo/base.html' %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card border-0 shadow-lg"><div class="card-body p-4"><h1 class="h3 fw-bold mb-4">Créer un compte</h1><form method="post" class="row g-3">{% csrf_token %}{% for field in form %}<div class="col-md-6"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<div class="col-12"><button class="btn btn-gold btn-lg">Créer mon compte</button></div></form></div></div></div></div></div>
{% endblock %}
