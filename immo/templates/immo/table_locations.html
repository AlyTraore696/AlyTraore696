<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Locataire</th><th>Logement</th><th>Début</th><th>Fin</th></tr></thead><tbody>{% for location in locations %}<tr><td>{{ location.locataire.nom }}</td><td>{{ location.logement.adresse }}</td><td>{{ location.date_debut }}</td><td>{{ location.date_fin }}</td></tr>{% empty %}<tr><td colspan="4" class="text-muted">Aucune location.</td></tr>{% endfor %}</tbody></table></div>
